<!DOCTYPE html>
<html lang="id" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login – Hub ATR/BPN Banjar</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>tailwind.config = { theme: { extend: { colors: { primary: '#1e40af', secondary: '#3b82f6' } } } }</script>
</head>
<body class="min-h-screen bg-gradient-to-br from-primary to-secondary flex items-center justify-center p-4">

    <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md p-8">
        <div class="text-center mb-8">
            <div class="w-16 h-16 bg-primary rounded-full flex items-center justify-center mx-auto mb-4">
                <i class="fa-solid fa-map-location-dot text-white text-2xl"></i>
            </div>
            <h1 class="text-2xl font-bold text-gray-800">Admin Panel</h1>
            <p class="text-gray-500 text-sm mt-1">Hub ATR/BPN Banjar</p>
        </div>

        <div id="alert" class="hidden bg-red-50 border border-red-200 text-red-700 text-sm rounded-lg px-4 py-3 mb-4 flex items-center gap-2">
            <i class="fa-solid fa-circle-exclamation"></i>
            <span id="alert-msg">Username atau password salah.</span>
        </div>

        <form id="login-form" class="space-y-5">
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">Username</label>
                <div class="relative">
                    <span class="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"><i class="fa-solid fa-user"></i></span>
                    <input id="username" type="text" placeholder="Masukkan username"
                        class="w-full pl-10 pr-4 py-3 border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary text-sm" required>
                </div>
            </div>
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">Password</label>
                <div class="relative">
                    <span class="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"><i class="fa-solid fa-lock"></i></span>
                    <input id="password" type="password" placeholder="Masukkan password"
                        class="w-full pl-10 pr-10 py-3 border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary text-sm" required>
                    <button type="button" onclick="togglePassword()" class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600">
                        <i id="eye-icon" class="fa-solid fa-eye"></i>
                    </button>
                </div>
            </div>
            <button type="submit" id="login-btn"
                class="w-full bg-primary text-white py-3 rounded-lg font-semibold hover:bg-blue-900 transition flex items-center justify-center gap-2">
                <i class="fa-solid fa-right-to-bracket"></i> Masuk
            </button>
        </form>

        <div class="mt-6 text-center">
            <a href="../index.html" class="text-sm text-gray-400 hover:text-primary transition">
                <i class="fa-solid fa-arrow-left mr-1"></i> Kembali ke Website
            </a>
        </div>
    </div>

    <script>
        // Cek jika sudah login
        if (localStorage.getItem('admin_logged_in') === 'true') {
            window.location.href = 'dashboard.html';
        }

        function togglePassword() {
            const pw = document.getElementById('password');
            const icon = document.getElementById('eye-icon');
            if (pw.type === 'password') {
                pw.type = 'text';
                icon.classList.replace('fa-eye', 'fa-eye-slash');
            } else {
                pw.type = 'password';
                icon.classList.replace('fa-eye-slash', 'fa-eye');
            }
        }

        document.getElementById('login-form').addEventListener('submit', function(e) {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const btn = document.getElementById('login-btn');

            // Kredensial admin (ganti sesuai kebutuhan)
            const ADMIN_USER = 'admin';
            const ADMIN_PASS = 'atr bpn2026';

            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Memeriksa...';
            btn.disabled = true;

            setTimeout(() => {
                if (username === ADMIN_USER && password === ADMIN_PASS) {
                    localStorage.setItem('admin_logged_in', 'true');
                    localStorage.setItem('admin_user', username);
                    window.location.href = 'dashboard.html';
                } else {
                    document.getElementById('alert').classList.remove('hidden');
                    document.getElementById('alert-msg').textContent = 'Username atau password salah. Coba lagi.';
                    btn.innerHTML = '<i class="fa-solid fa-right-to-bracket"></i> Masuk';
                    btn.disabled = false;
                }
            }, 800);
        });
    </script>
</body>
</html>
